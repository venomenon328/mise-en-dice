name: Materialize PR 55 review fixes

on:
  push:
    branches:
      - feat/52-final-catalog-snapshot

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Materialize and verify reviewed catalog state
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), got {count}: {old!r}')
              p.write_text(text.replace(old, new))

          # The reviewed catalog correction changes final-state counts. Keep tests that
          # deliberately target the predecessor state unchanged; update only assertions
          # against the fully migrated/current projection.
          projection_test = 'src/test/java/io/github/venomenon328/miseendice/catalog/internal/CatalogGeneratorProjectionIntegrationTest.java'
          replace_exact(projection_test, '.hasSize(652);', '.hasSize(651);')
          replace_exact(projection_test, '.hasSize(46)\n', '.hasSize(47)\n')

          postgres_test = 'src/test/java/io/github/venomenon328/miseendice/PostgresIntegrationTest.java'
          replace_exact(postgres_test, 'assertThat(activeDrawConceptCount).isEqualTo(652L);', 'assertThat(activeDrawConceptCount).isEqualTo(651L);')
          replace_exact(postgres_test, 'assertThat(refinementCount).isEqualTo(777L);', 'assertThat(refinementCount).isEqualTo(780L);', expected=2)

          p = Path('.github/scripts/pr55_review_fix.py')
          text = p.read_text()
          if 'assert_seasonality_detail' in text:
              raise SystemExit('unexpected helper variant: seasonality assertion present')

          replacements = {
              "('| `AROMATIC` | 89 / 94 | 99 / 100 |', '| `AROMATIC` | 89 / 94 | 98 / 100 |')": "('| `AROMATIC` | 89 / 96 | 99 / 102 |', '| `AROMATIC` | 89 / 96 | 98 / 101 |')",
              "('| `SEASONING` | 196 / 212 | 216 / 229 |', '| `SEASONING` | 196 / 212 | 215 / 229 |')": "('| `SEASONING` | 196 / 212 | 216 / 229 |', '| `SEASONING` | 196 / 212 | 215 / 228 |')",
              "    ROOT / '.github/workflows/pr55-workflow-repair.yml',\n": "    ROOT / '.github/workflows/pr55-workflow-repair.yml',\n    ROOT / '.github/workflows/pr55-finalize.yml',\n    ROOT / '.github/workflows/pr55-materialize.yml',\n",
              "run('git', 'push', 'origin', 'HEAD:feat/52-final-catalog-snapshot')": "run('git', 'push', '--force', 'origin', 'HEAD:refs/heads/agent/pr55-materialized')",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one helper occurrence, got {text.count(old)}: {old!r}')
              text = text.replace(old, new)
          p.write_text(text)
          subprocess.run(['python', str(p)], check=True)
