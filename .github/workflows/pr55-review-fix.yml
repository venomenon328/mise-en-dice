name: PR 55 review fixes

on:
  push:
    branches:
      - feat/52-final-catalog-snapshot

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Apply review fixes, regenerate snapshot and verify
        run: python .github/scripts/pr55_review_fix.py
