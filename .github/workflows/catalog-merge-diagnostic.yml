name: Merge main into catalog review

on:
  push:
    branches:
      - agent/issue-23-catalog-gap-review

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-23-catalog-gap-review
          fetch-depth: 0
      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/catalog-merge-diagnostic.yml
          git commit -m 'Merge current main into catalog gap review'
          git push origin HEAD:agent/issue-23-catalog-gap-review
