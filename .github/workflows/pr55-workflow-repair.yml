name: Repair PR 55 review workflow

on:
  push:
    branches:
      - feat/52-final-catalog-snapshot

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair strict replacement for duplicated EASY row
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/pr55-review-fix.yml')
          text = p.read_text()
          old = '''          for old, new in replacements.items():
              replace_once(readiness, old, new)
'''
          new = '''          for old, new in replacements.items():
              if old == '| `EASY` | 437 |':
                  p = Path(readiness)
                  text = p.read_text()
                  if text.count(old) != 2:
                      raise SystemExit(f"{readiness}: expected two occurrences, got {text.count(old)}: {old!r}")
                  p.write_text(text.replace(old, new))
              else:
                  replace_once(readiness, old, new)
'''
          if text.count(old) != 1:
              raise SystemExit('repair insertion point not unique')
          p.write_text(text.replace(old, new))
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr55-workflow-repair.yml
          git add .github/workflows/pr55-review-fix.yml
          git commit -m 'Repair temporary PR 55 review workflow'
          git push origin HEAD:feat/52-final-catalog-snapshot
