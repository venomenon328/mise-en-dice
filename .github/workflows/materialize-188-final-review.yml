name: Materialize #188 final review

on:
  push:
    branches:
      - feat/188-availability-novelty-review

permissions:
  contents: write

concurrency:
  group: materialize-188-final-review
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize authoritative review
        run: python docs/analysis/materialize-availability-novelty-final-review-v1.py

      - name: Check generated diff
        run: git diff --check

      - name: Commit generated review artifacts
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/analysis/availability-novelty-final-review-v1-20260907.tsv \
            docs/analysis/availability-novelty-final-review-v1-20260907-summary.json \
            docs/analysis/availability-novelty-final-review-v1-20260907.md
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git commit -m "docs: materialize authoritative availability novelty review"
          git push
