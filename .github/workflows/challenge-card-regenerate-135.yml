name: Challenge Card Regenerate 135

on:
  push:
    branches:
      - feat/135-challenge-card-master-template
    paths:
      - .github/workflows/challenge-card-regenerate-135.yml
      - design/challenge-cards/templates/generate_challenge_card_templates.py
      - design/challenge-cards/assets/background/mise-en-dice-background-master.png

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/135-challenge-card-master-template

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-go
          fc-cache -f
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          echo "CHALLENGE_CARD_BROWSER=$BROWSER" >> "$GITHUB_ENV"

      - name: Regenerate and validate Challenge Card references
        run: |
          python design/challenge-cards/templates/generate_challenge_card_templates.py
          python design/challenge-cards/templates/generate_challenge_card_templates.py --render
          python design/challenge-cards/templates/generate_challenge_card_templates.py --check
          python design/challenge-cards/templates/generate_challenge_card_templates.py --render-check

      - name: Commit generated review artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/challenge-cards/templates/challenge-card-master-*.svg
          git add design/challenge-cards/examples/reference-*.svg
          git add design/challenge-cards/examples/renders
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "design: regenerate background-master references"
            git push origin HEAD:feat/135-challenge-card-master-template
          fi
