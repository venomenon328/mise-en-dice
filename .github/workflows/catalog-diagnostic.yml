name: Apply catalog gap review

on:
  push:
    branches:
      - agent/issue-23-catalog-gap-review

permissions:
  contents: write

concurrency:
  group: catalog-gap-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-23-catalog-gap-review
          fetch-depth: 0
      - name: Apply prepared catalog patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/catalog-gap-review.part.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/catalog-gap-review.patch
          git apply --index /tmp/catalog-gap-review.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deepen catalog hierarchy and close remaining gaps'
          git push origin HEAD:agent/issue-23-catalog-gap-review
