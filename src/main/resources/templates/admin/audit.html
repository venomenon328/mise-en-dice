<!doctype html>
<html lang="de" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Änderungen · Mise en Dice</title><link rel="stylesheet" th:href="@{/admin/assets/catalog.css}"><script defer src="/webjars/htmx.org/2.0.4/dist/htmx.min.js"></script><script defer th:src="@{/admin/assets/catalog.js}"></script></head>
<body><header class="site-header"><a class="brand" th:href="@{/admin/catalog}"><span>Mise en <strong>Dice</strong></span></a><nav class="main-nav" aria-label="Administration"><a class="main-nav-link" th:href="@{/admin/catalog}">Katalog</a><a class="main-nav-link" th:href="@{/admin/exclusions}">Ausschlüsse</a><a class="main-nav-link is-active" aria-current="page" th:href="@{/admin/audit}">Änderungen</a></nav><div class="account"><span class="account-name" th:text="${administratorDisplayName}">Administration</span><form th:action="@{/logout}" method="post"><button class="button button--ghost button--small" type="submit">Abmelden</button></form></div></header>
<main class="catalog-shell"><section class="catalog-navigation"><div class="section-title"><div><p class="eyebrow">Redaktionelle Historie</p><h1>Änderungen</h1></div><span class="catalog-count" th:text="|${auditResults.totalItems} Einträge|">Einträge</span></div><form class="catalog-filters" method="get" th:action="@{/admin/audit}"><div class="advanced-filter-grid"><label>Akteur <input name="actor" th:value="${state.actorKey}"></label><label>von <input type="datetime-local" name="after" th:value="${state.after}"></label><label>bis <input type="datetime-local" name="before" th:value="${state.before}"></label><label>Entität <select name="entityType"><option value="">alle</option><option th:each="type : ${auditEntityTypes}" th:value="${type.name()}" th:selected="${state.entityType == type}" th:text="${type == T(io.github.venomenon328.miseendice.catalog.api.CatalogAuditQueries.CatalogAuditEntityType).INGREDIENT_CONCEPT ? 'Zutatenkonzept' : 'Ausschlussregel'}">Entität</option></select></label><label>Entität-ID <input type="number" min="1" name="entityId" th:value="${state.entityId}"></label><label>Aktion <select name="action"><option value="">alle</option><option th:each="value : ${auditActions}" th:value="${value}" th:selected="${state.action == value}" th:text="${value}">UPDATE</option></select></label></div><button class="button button--primary" type="submit">Filter anwenden</button></form><ol class="catalog-list" data-testid="audit-list"><li th:each="item : ${auditResults.items}" th:classappend="${state.selectedEntryId == item.id} ? ' selected'"><div class="list-entry-heading"><a th:href="${state.entryUrl(item.id)}" th:hx-get="${state.entryUrl(item.id)}" hx-target="#audit-detail" hx-swap="outerHTML" hx-push-url="true"><strong th:text="${item.entityLabel}">Eintrag</strong><code th:text="${item.action}">UPDATE</code></a><span th:text="${#temporals.format(item.occurredAt, 'dd.MM.yyyy HH:mm:ss')}">Zeit</span></div><div class="list-entry-meta"><span th:text="|Akteur: ${item.actorKey}|">Akteur</span><span th:text="|Entität: ${item.entityType} #${item.entityId}|">Entität</span><span th:text="|Gruppe: ${item.changeGroupId}|">Gruppe</span></div></li><li th:if="${auditResults.items.isEmpty()}" class="empty-state"><h2>Keine Änderungen gefunden</h2><p>Die aktuellen Filter liefern keine Audit-Einträge.</p></li></ol><nav th:if="${auditResults.pageCount > 1}" class="pagination"><a th:if="${auditResults.page > 0}" class="button button--secondary button--small" th:href="${state.listUrl(auditResults.page - 1)}">Zurück</a><span th:text="|Seite ${auditResults.page + 1} von ${auditResults.pageCount}|">Seite</span><a th:if="${auditResults.page + 1 < auditResults.pageCount}" class="button button--secondary button--small" th:href="${state.listUrl(auditResults.page + 1)}">Weiter</a></nav></section><section class="catalog-detail-column" aria-live="polite"><section th:replace="~{admin/fragments/audit :: panel}"></section></section></main>
</body></html>
