<!doctype html>
<html lang="de" xmlns:th="https://www.thymeleaf.org"><body><section th:fragment="panel" id="audit-detail" class="detail-panel" data-testid="audit-detail"><section th:if="${missingAuditEntryId != null}" class="detail-empty error"><h2>Nicht verfügbar</h2><p>Dieser Audit-Eintrag ist nicht mehr verfügbar.</p></section><section th:if="${auditDetail == null and missingAuditEntryId == null}" class="detail-empty"><h2>Änderung auswählen</h2><p>Wähle links einen Audit-Eintrag aus.</p></section><section th:if="${auditDetail != null}"><header class="detail-header"><div><p class="eyebrow" th:text="${auditDetail.entry.action}">UPDATE</p><h2 th:text="${auditDetail.entityLabel}">Eintrag</h2><p class="technical" th:text="|${auditDetail.entry.entityType} #${auditDetail.entry.entityId} · ${auditDetail.entry.changeGroupId}|">Technik</p></div></header><section class="detail-section"><dl class="detail-list"><div><dt>Zeitpunkt</dt><dd th:text="${#temporals.format(auditDetail.entry.occurredAt, 'dd.MM.yyyy HH:mm:ss')}">Zeit</dd></div><div><dt>Akteur</dt><dd th:text="${auditDetail.entry.actorKey}">Akteur</dd></div></dl></section><section class="detail-section"><div class="detail-section-heading"><p class="section-kicker">Feldweiser Vergleich</p><h3>Änderungen</h3></div><table class="season-table audit-diff"><thead><tr><th>Feld</th><th>Vorher</th><th>Nachher</th></tr></thead><tbody><tr th:each="change : ${auditDetail.diff}" th:classappend="| audit-diff--${#strings.toLowerCase(change.kind.name())}|"><th th:text="${change.label}">Feld</th><td th:text="${change.beforeValue ?: '—'}">Vorher</td><td th:text="${change.afterValue ?: '—'}">Nachher</td></tr><tr th:if="${auditDetail.diff.isEmpty()}"><td colspan="3">Keine fachlich sichtbare Feldänderung.</td></tr></tbody></table></section></section></section></body></html>
